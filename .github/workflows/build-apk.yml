name: Build Shahkar Khazana APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Cordova
        run: npm install -g cordova@12
      - name: Create Android app
        run: |
          cordova create buildapp com.maqboolahmed.shahkarkhazana "شاہکار خزانہ"
          cp index.html buildapp/www/index.html
          cd buildapp
          cordova platform add android@13
          cordova plugin add ../backup-picker-plugin
          cordova build android --debug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp buildapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk output/Shahkar-Khazana-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shahkar-Khazana-APK
          path: output/Shahkar-Khazana-debug.apk
          retention-days: 14
